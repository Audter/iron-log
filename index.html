<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="description" content="Weight training, Thai food calories and progress tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Iron Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>:root{color-scheme:light}

/* Layout: one mobile column (max 560px), date header on top, tab bar fixed at bottom; IWF plate colours encode session (blue=upper, red=lower, green=cardio) and state */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#14181D; --muted:#5A6471; --line:#D3D9E0;
  --accent:#2152C4; --accent-ink:#FFFFFF; --accent-soft:#E2E9FA;
  --plate-red:#C42F27; --plate-blue:#2152C4; --plate-yellow:#D9A400; --plate-green:#1E8A4A; --plate-white:#E9EAE4; --plate-edge:#9AA2AC;
  --good:#1E8A4A; --good-soft:#DFF1E6; --warn:#9A6A00; --warn-soft:#F8EDCC; --bad:#C42F27; --bad-soft:#F8E0DE;
  --art-filter:none; --art-blend:multiply;
  --display:"Barlow Condensed","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#171B21; --sunk:#1E242B; --ink:#E7EBEF; --muted:#9AA4B0; --line:#2B323B;
  --accent:#7097FF; --accent-ink:#0E1115; --accent-soft:#1D2840;
  --plate-red:#FF6A5C; --plate-blue:#7097FF; --plate-yellow:#F0C232; --plate-green:#4CC27E; --plate-white:#D7D9D2; --plate-edge:#5D6670;
  --good:#4CC27E; --good-soft:#16301F; --warn:#F0C232; --warn-soft:#352C10; --bad:#FF6A5C; --bad-soft:#3A1A17;
  --art-filter:invert(1) hue-rotate(180deg); --art-blend:screen;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --sunk:#1E242B; --ink:#E7EBEF; --muted:#9AA4B0; --line:#2B323B;
  --accent:#7097FF; --accent-ink:#0E1115; --accent-soft:#1D2840;
  --plate-red:#FF6A5C; --plate-blue:#7097FF; --plate-yellow:#F0C232; --plate-green:#4CC27E; --plate-white:#D7D9D2; --plate-edge:#5D6670;
  --good:#4CC27E; --good-soft:#16301F; --warn:#F0C232; --warn-soft:#352C10; --bad:#FF6A5C; --bad-soft:#3A1A17;
  --art-filter:invert(1) hue-rotate(180deg); --art-blend:screen;
  color-scheme:dark}

html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
img{max-width:100%}
label.btn{display:inline-flex;align-items:center}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em}
h3{font-size:16px;font-weight:600}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em}
.brand i{display:block;width:6px;border-radius:2px}
.brand i:nth-child(1){height:22px;background:var(--plate-red)}
.brand i:nth-child(2){height:18px;background:var(--plate-blue)}
.brand i:nth-child(3){height:14px;background:var(--plate-yellow)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--good)} .sync.local::before{background:var(--warn)} .sync.err::before{background:var(--bad)}
.datebar{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.datebar .d{flex:1;text-align:center;font-weight:600}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:9px;cursor:pointer;font-size:20px;line-height:1;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.chipbtn{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input:not([type]),select{width:100%;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:16px}
input::placeholder{color:var(--muted);opacity:.75}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;font-size:15px}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.note{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note b{color:var(--ink)}

/* big number + bars */
.big{font-family:var(--display);font-size:38px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--muted);font-weight:500;margin-left:4px}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .spread span:last-child{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.track{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:var(--accent);border-radius:6px 0 0 6px;transition:width .3s}
.fill.good{background:var(--good)} .fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

/* sessions */
.sessions{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sess{flex:1 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:62px}
.sess b{font-family:var(--display);font-size:17px;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.sess span{font-size:11px;color:var(--muted)}
.sess[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.disc{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;border:1px solid var(--plate-edge)}
.disc.blue{background:var(--plate-blue)} .disc.red{background:var(--plate-red)} .disc.green{background:var(--plate-green)} .disc.yellow{background:var(--plate-yellow)} .disc.white{background:var(--plate-white)}

.ex header{display:flex;align-items:flex-start;gap:12px}
.ex .th{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.hint b{color:var(--ink);font-family:var(--display);font-size:16px}
.hint .up{color:var(--good);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 14px 1fr 46px;gap:6px;align-items:center}
.set .idx{font-family:var(--display);color:var(--muted);text-align:center;font-size:16px}
.set input{text-align:center;padding:8px 4px;font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.set .x{text-align:center;color:var(--muted)}
.chk{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;font-size:18px;color:var(--muted)}
.set.done .chk{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.set.done input{border-color:var(--good)}
.colhead{display:grid;grid-template-columns:22px 1fr 14px 1fr 46px;gap:6px;font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 0;font-size:14px;font-weight:500;align-self:flex-start}

.plates{display:flex;align-items:center;gap:2px;height:40px}
.plates .bar{width:26px;height:6px;background:var(--plate-edge);border-radius:2px}
.plates .p{width:9px;border-radius:2px;border:1px solid var(--plate-edge)}
.plates .lbl{margin-left:10px;font-size:12px;color:var(--muted)}

/* food */
.photo{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:16px;cursor:pointer;background:var(--sunk);text-align:center;font-weight:500}
.photo img{max-height:160px;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.chips button span{color:var(--muted);font-variant-numeric:tabular-nums}
.meal{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .nm{min-width:0;overflow-wrap:anywhere}
.meal .nm small{display:block;color:var(--muted);font-size:12px}
.meal .k{font-family:var(--display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.del{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;width:34px;height:34px;border-radius:8px}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.slot-h{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.draft{display:flex;flex-direction:column;gap:10px}
.ditem{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.ditem .nmf{grid-column:1/-1}
.ditem input{padding:7px 6px;font-size:15px}
.ditem label{font-size:11px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;list-style-position:inside}
.err{color:var(--bad);font-size:14px}
.ok{color:var(--good);font-size:14px}
.welcome{border-color:var(--accent);background:var(--accent-soft)}.ok b{font-family:var(--display);font-size:16px}
.photo{justify-content:flex-start;text-align:left;padding:14px 16px}
.photo small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.cam{width:38px;height:38px;border-radius:50%;background:var(--accent);flex:none;position:relative}
.cam::after{content:"";position:absolute;inset:11px;border-radius:50%;border:2.5px solid var(--accent-ink)}
.quick{display:flex;gap:8px}.quick input{flex:1}
.sugg{display:flex;flex-direction:column;gap:6px}
.sg{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 12px;cursor:pointer;color:inherit;font-size:15px}
.sg:first-child{border-color:var(--accent)}
.sg .sn{flex:1;min-width:0;overflow-wrap:anywhere}.sg .sn i{font-style:normal;font-size:11px;color:var(--good);background:var(--good-soft);border-radius:999px;padding:1px 7px;margin-left:4px}
.sg small{display:block;font-size:12px;color:var(--muted)}
.sg .sk{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sg.ai{background:transparent;border-style:dashed}.sg.ai .sn{font-size:14px;color:var(--muted)}
.sg.multi{background:var(--accent-soft)}
.qty{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qty input{width:64px;text-align:center;font-family:var(--display);font-size:18px;font-weight:600}
.stp{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);font-size:20px;cursor:pointer}
.chipbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.meal button.nm{border:0;background:none;text-align:left;padding:4px 0;cursor:pointer;color:inherit;font-size:15px}
.meal.pending{opacity:.7}.meal.pending .nm{display:flex;gap:8px;align-items:center}
.meal.pending img{width:38px;height:38px;object-fit:cover;border-radius:6px;flex:none}
.medit{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:2px 0 12px}
.medit .full{grid-column:1/-1}.medit input{padding:7px 6px;font-size:15px}
.lowc{color:var(--warn)}

/* progress */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .raw{fill:var(--muted);opacity:.55}
.chart .main{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.09}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .endlbl{fill:var(--ink);font-weight:600;font-size:11px}
.chart .tgt{stroke:var(--good);stroke-width:1.5;stroke-dasharray:4 4}
.chart .tgtlbl{fill:var(--good);font-size:10px}
.chart .b-ok{fill:var(--accent)} .chart .b-over{fill:var(--bad)} .chart .b-under{fill:var(--plate-edge)}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:14px;background:var(--sunk);border-radius:10px}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);overflow-x:auto;white-space:nowrap}

/* tab bar + rest timer */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:8px 4px;cursor:pointer;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.tabs button b{font-family:var(--display);font-size:15px;letter-spacing:.05em}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.rest{position:fixed;left:0;right:0;z-index:19;bottom:calc(66px + env(safe-area-inset-bottom,0px));
  padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.rest .in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;overflow:hidden;position:relative}
.rest .t{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:64px}
.rest .rl{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.rest .rl b{font-weight:600;font-size:14px}
.rest .rl small{font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest .nx{flex:none;width:52px;height:52px;border:0;border-radius:9px;background:var(--surface);padding:2px;cursor:pointer;margin:0}
.rest .rb{position:absolute;left:0;bottom:0;height:3px;background:var(--plate-yellow)}
.rest.done .in{background:var(--good);color:var(--accent-ink)}
.rest button{margin-left:auto;border:0;background:transparent;color:inherit;font-size:14px;cursor:pointer;text-decoration:underline}

/* exercise demo */
.ex header .ttl{flex:1;min-width:0}
.demo{flex:none;width:84px;height:84px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:2px;cursor:pointer;position:relative;overflow:hidden}
.demo::after{content:"";position:absolute;right:5px;bottom:5px;border-left:9px solid var(--accent);border-top:6px solid transparent;border-bottom:6px solid transparent;opacity:.85}
.art{position:relative;width:100%;height:100%;filter:var(--art-filter)}
.art img,.art .fig,.art svg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:var(--art-blend)}
.art .b{animation:ekfade 3s ease-in-out infinite}
@keyframes ekfade{0%,15%{opacity:0}40%,62%{opacity:1}88%,100%{opacity:0}}
.sheet{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.sheet .in{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet .big-art{width:100%;max-width:340px;aspect-ratio:268/275;align-self:center;background:var(--surface)}
.sheet .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .pair .art{aspect-ratio:268/275;height:auto;border:1px solid var(--line);border-radius:10px}
.sheet .pair span{display:block;text-align:center;font-size:12px;color:var(--muted)}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.credit{font-size:12px;color:var(--muted)}
.credit a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){.art .b{animation:none;opacity:0}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><p class="muted" style="padding:40px 0;text-align:center">กำลังโหลด Iron Log…</p></div>

<div class="sheet" id="sheet" hidden></div>
<div class="rest" id="rest" hidden><div class="in"><span class="t" id="restTime">0:00</span><span id="restNext"></span><span class="rl"><b id="restLbl">พักระหว่างเซ็ต</b><small id="restNextTxt"></small></span><button type="button" id="restClose">ปิด</button><span class="rb" id="restBar"></span></div></div>

<div class="tabs"><nav aria-label="เมนูหลัก">
  <button type="button" data-view="today"><b>TODAY</b>วันนี้</button>
  <button type="button" data-view="train"><b>TRAIN</b>เวท</button>
  <button type="button" data-view="food"><b>FOOD</b>อาหาร</button>
  <button type="button" data-view="progress"><b>PROGRESS</b>ผลลัพธ์</button>
</nav></div>
<script>
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const tIdx=s=>Math.round(Date.parse(s+'T00:00:00Z')/864e5);

function normQ(x){return String(x||'').toLowerCase().replace(/[\s\-_.,()\/]+/g,'')}

const SLOT_ORDER=['b','l','s','d'];

/* ---------- state ---------- */
const DEF_PROFILE={age:47,height:170,activity:1.55,deficit:500,ppk:1.8,fpk:0.75,goalWeight:75,kcalOverride:null};
const S={days:{},profile:{...DEF_PROFILE},view:'today',date:today(),mode:'local',readonly:false,
  sess:null,canAI:false,canImg:false,aiErr:'',aiMsg:'',editMeal:null,slot:defaultSlot(),e1rmEx:null};
function day(d=S.date){return S.days[d]||(S.days[d]={kind:'day',date:d,weight:null,waist:null,meals:[],sets:[],cardio:null,session:null})}
function sessionFor(d){const D=S.days[d];return (D&&D.session)||WD_SESSION[dow(d)]||null}

/* ---------- storage: localStorage cache + db (owner-only) ---------- */
const LS='ironlog.v1';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){S.days=j.days||{};S.profile={...DEF_PROFILE,...(j.profile||{})}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({days:S.days,profile:S.profile}))}catch(e){}}
let db=null,sample=null;const dirty=new Set(),timers={},chains={};
function saveDay(d=S.date){saveLocal();dirty.add(d);clearTimeout(timers[d]);timers[d]=setTimeout(()=>{timers[d]=null;flush(d)},700)}
function flush(d){chains[d]=(chains[d]||Promise.resolve()).then(async()=>{
  if(db&&!S.readonly&&S.days[d]){try{await db.doc('days/'+d).set(JSON.parse(JSON.stringify(S.days[d])));setSync('ok')}catch(e){dbErr(e)}}
  if(!timers[d])dirty.delete(d)})}
let profTimer=null,profDirty=false,profChain=Promise.resolve();
function saveProfile(){saveLocal();profDirty=true;clearTimeout(profTimer);profTimer=setTimeout(()=>{profTimer=null;profChain=profChain.then(async()=>{
  if(db&&!S.readonly){try{await db.doc('meta/profile').set({...S.profile});setSync('ok')}catch(e){dbErr(e)}}if(!profTimer)profDirty=false})},700)}
function dbErr(e){if(e&&e.code==='invalid_argument'){S.readonly=true;setSync('ro')}else setSync('err')}
let syncState='local';
function setSync(s){syncState=s;const el=$('#sync');if(el)el.outerHTML=syncChip()}
function syncChip(){const m={ok:['ok','ซิงก์ทุกเครื่อง'],local:['local','บันทึกในเครื่องนี้'],err:['err','ซิงก์ไม่สำเร็จ ลองใหม่อัตโนมัติ'],ro:['err','อ่านอย่างเดียว']}[syncState]||['local',''];return `<span class="sync ${m[0]}" id="sync">${m[1]}</span>`}

let pendingRender=false;
function safeRender(){const a=document.activeElement;
  if(!(a&&a.id&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA/.test(a.tagName))){render();return}
  const id=a.id,v=a.value,ss=a.selectionStart,se=a.selectionEnd;render();
  const b=document.getElementById(id);if(b){b.value=v;b.focus();try{b.setSelectionRange(ss,se)}catch(e){}}}

async function boot(){
  loadLocal();render();
  const cl=window.claude;const use=n=>cl&&cl.use?Promise.resolve(cl.use(n)).catch(()=>null):Promise.resolve(null);
  initAI();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  const u=await use('user');
  if(u){try{const o=await u.isOwner();if(o===false){S.readonly=true}}catch(e){}}
  const d=await use('db');
  if(!d){setSync('local');return}
  db=d;if(S.readonly){setSync('ro');return}
  setSync('ok');
  db.collection('days').onSnapshot(snap=>{let ch=false;
    for(const doc of snap.docs){if(dirty.has(doc.id))continue;const v=doc.data();if(!v)continue;const cur=S.days[doc.id];
      if(!cur||JSON.stringify(cur)!==JSON.stringify(v)){S.days[doc.id]=JSON.parse(JSON.stringify(v));ch=true}}
    if(ch){saveLocal();safeRender()}},e=>dbErr(e));
  db.doc('meta/profile').onSnapshot(s=>{if(profDirty||!s.exists)return;const v=s.data();const np={...DEF_PROFILE,...v};
    if(JSON.stringify(np)!==JSON.stringify(S.profile)){S.profile=np;saveLocal();safeRender()}},e=>dbErr(e));
}

/* ---------- models ---------- */
function weights(){return Object.values(S.days).filter(d=>d.weight).map(d=>({d:d.date,t:tIdx(d.date),w:d.weight})).sort((a,b)=>a.t-b.t)}
function waists(){return Object.values(S.days).filter(d=>d.waist).map(d=>({d:d.date,t:tIdx(d.date),w:d.waist})).sort((a,b)=>a.t-b.t)}
function maAt(arr,t,win=7){const xs=arr.filter(p=>p.t<=t&&p.t>t-win);return xs.length?xs.reduce((s,p)=>s+p.w,0)/xs.length:null}
function latestWeight(){const ws=weights();return ws.length?(maAt(ws,ws[ws.length-1].t)||ws[ws.length-1].w):82}
function slope(pts){const n=pts.length;if(n<2)return null;const mx=pts.reduce((s,p)=>s+p.t,0)/n,my=pts.reduce((s,p)=>s+p.w,0)/n;
  let a=0,b=0;for(const p of pts){a+=(p.t-mx)*(p.w-my);b+=(p.t-mx)**2}return b?a/b:null}
function targets(){const p=S.profile;const w=latestWeight();const bmr=10*w+6.25*p.height-5*p.age+5;const tdee=bmr*p.activity;
  const kcal=p.kcalOverride||r10(tdee-p.deficit);const protein=Math.round(p.ppk*w);const fat=Math.round(p.fpk*w);
  const carb=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));return{bmr:Math.round(bmr),tdee:r10(tdee),kcal,protein,fat,carb,w}}
function totals(D){const t={kcal:0,p:0,c:0,f:0};for(const m of D.meals||[]){t.kcal+=+m.kcal||0;t.p+=+m.p||0;t.c+=+m.c||0;t.f+=+m.f||0}return t}
function weeklyRate(){const ws=weights();if(ws.length<4)return null;const end=ws[ws.length-1].t;const pts=ws.filter(p=>p.t>end-14);if(pts.length<4)return null;const s=slope(pts);return s==null?null:s*7}
function adaptive(){const ws=weights();if(!ws.length)return{need:'บันทึกน้ำหนัก + อาหารทุกวัน ~2 สัปดาห์'};
  const end=ws[ws.length-1].t,start=end-20;const wpts=ws.filter(p=>p.t>=start);
  const intake=Object.values(S.days).filter(d=>{const t=tIdx(d.date);return t>=start&&t<=end}).map(d=>totals(d).kcal).filter(k=>k>=1000);
  if(wpts.length<8||intake.length<10)return{need:`ต้องการน้ำหนัก ${Math.max(0,8-wpts.length)} วัน และวันที่บันทึกอาหารครบ ${Math.max(0,10-intake.length)} วันเพิ่ม`};

const reduceMotion=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
function artHTML(id,which){if(!FIGS[id])return '';
  if(which==='a'||which==='b')return `<div class="art">${figSVG(id,which==='a'?0:1)}</div>`;
  return `<div class="art" role="img" aria-label="ภาพเคลื่อนไหวท่า ${esc(EX[id].n)}"><div class="fig" data-fig="${id}">${figSVG(id,0)}</div></div>`}
function refHTML(id){const d=DEMO[id];if(!d||!d.ek)return '';
  return `<h3>ภาพอ้างอิง</h3><div class="pair"><div class="art"><img src="ek/${d.ek}-relaxation.svg" alt="ภาพอ้างอิงท่า ${esc(EX[id].n)} 1"></div><div class="art"><img src="ek/${d.ek}-tension.svg" alt="ภาพอ้างอิงท่า ${esc(EX[id].n)} 2"></div></div>`}
function cycleT(ms){const p=(ms%3000)/3000;const e=x=>.5-.5*Math.cos(Math.PI*x);
  if(p<.15)return 0;if(p<.4)return e((p-.15)/.25);if(p<.62)return 1;if(p<.88)return 1-e((p-.62)/.26);return 0}
let figRAF=0,figLast=0;
function figLoop(ts){figRAF=requestAnimationFrame(figLoop);if(reduceMotion||document.hidden||ts-figLast<33)return;figLast=ts;
  const els=document.querySelectorAll('.fig[data-fig]');if(!els.length)return;const t=cycleT(ts);
  els.forEach(el=>{el.innerHTML=figSVG(el.dataset.fig,t)})}
if(!reduceMotion)figRAF=requestAnimationFrame(figLoop);
function openDemo(id){const d=DEMO[id],e=EX[id];if(!d||!e)return;const sh=$('#sheet');
  const credit='ภาพเคลื่อนไหว: Iron Log'+(d.ek?` · ภาพอ้างอิง: <a href="https://github.com/everkinetic/data" target="_blank" rel="noopener">Everkinetic</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>`:'');
  sh.innerHTML=`<div class="in" role="dialog" aria-modal="true" aria-labelledby="demoTtl">
    <div class="spread"><div><h2 id="demoTtl">${esc(e.n)}</h2><p class="small muted">${esc(e.th)} · ${e.sets}×${e.lo}–${e.hi}</p></div><button class="iconbtn" id="demoClose" aria-label="ปิด">×</button></div>
    ${reduceMotion?`<div class="pair"><div>${artHTML(id,'a')}<span>ท่าเริ่ม</span></div><div>${artHTML(id,'b')}<span>ท่าสุด</span></div></div>`:`<div class="big-art">${artHTML(id)}</div>`}
    <h3>จุดสำคัญ</h3><ul class="cues">${d.c.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    ${d.near?`<p class="note">${esc(d.near)}</p>`:''}${refHTML(id)}
    <p class="credit">${credit}</p></div>`;
  sh.hidden=false;$('#demoClose').focus()}
function closeDemo(){const sh=$('#sheet');sh.hidden=true;sh.innerHTML=''}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('#demoClose'))closeDemo()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeDemo()});

/* ---------- views ---------- */
function header(){const isToday=S.date===today();return `
  <div class="top"><div class="brand" aria-label="Iron Log"><i></i><i></i><i></i>IRON LOG</div>${syncChip()}</div>
  <div class="datebar"><button class="iconbtn" data-act="prev" aria-label="วันก่อนหน้า">‹</button>
    <span class="d">${fmtDate(S.date)}${isToday?' · วันนี้':''}</span>
    ${isToday?'':'<button class="chipbtn" data-act="today">กลับวันนี้</button>'}
    <button class="iconbtn" data-act="next" aria-label="วันถัดไป">›</button></div>`}

function meter(label,val,tgt,unit,mode){const pct=tgt?Math.min(100,val/tgt*100):0;let cls='';
  if(mode==='kcal'){const r=val/tgt;cls=r>1.1?'bad':r>1.02?'warn':r>=.9?'good':''}
  else if(mode==='protein'){cls=val>=tgt*.9?'good':''}
  return `<div class="meter"><div class="spread"><span>${label}</span><span><b class="num">${Math.round(val)}</b> / ${tgt} ${unit}</span></div>
  <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`}

function viewToday(){const D=day(),T=targets(),tot=totals(D),ws=weights();const ma=maAt(ws,tIdx(S.date));
  const code=sessionFor(S.date);const P=code&&PROGRAM[code];
  let train;
  if(!P)train=`<p class="muted">วันพัก · เดินเล่นเบาๆ ยืดเหยียด นอนให้พอ 7 ชม.</p>`;
  else if(code==='Z2'){const c=D.cardio;train=`<div class="spread"><span><span class="disc green"></span> Zone 2 cardio</span><span class="num">${c&&c.min?c.min+' นาที':'ยังไม่บันทึก'}</span></div>`}
  else{const total=P.ex.reduce((s,e)=>s+e.sets,0);const done=(D.sets||[]).filter(s=>s.done&&P.ex.some(e=>e.id===s.ex)).length;
    train=`<div class="spread"><span><span class="disc ${P.plate}"></span> <b>${P.name}</b> <span class="muted small">${P.th}</span></span><span class="num">${done}/${total} เซ็ต</span></div>
    <div class="track"><div class="fill ${done>=total?'good':''}" style="width:${Math.min(100,done/total*100)}%"></div></div>`}
  const left=T.kcal-tot.kcal;
  const hasData=Object.values(S.days).some(d=>(d.meals&&d.meals.length)||(d.sets&&d.sets.length)||d.weight);
  const welcome=hasData?'':`<section class="card welcome"><h2>ย้ายข้อมูลเดิมมาที่แอปนี้</h2>
    <p class="small">แอปบน Home Screen เก็บข้อมูลแยกจาก Safari ถ้าเคย Export ไว้ (เช่น ใน Google Drive) นำเข้าได้เลย</p>
    <div class="row"><label class="btn" for="impFile2">Import JSON</label><input type="file" id="impFile2" hidden></div>
    <p class="small" id="bkStat2" role="status"></p></section>`;
  return `${header()}${welcome}
  <section class="card"><div class="spread"><h2>พลังงานวันนี้</h2><span class="pill ${left<0?'bad':''}">${left>=0?'เหลือ '+Math.round(left):'เกิน '+Math.round(-left)} kcal</span></div>
    <div class="big" id="kcalBig">${Math.round(tot.kcal)}<small>/ ${T.kcal} kcal</small></div>
    ${meter('Protein',tot.p,T.protein,'g','protein')}${meter('Carb',tot.c,T.carb,'g')}${meter('Fat',tot.f,T.fat,'g')}
    <button class="btn ghost" data-go="food">+ บันทึกอาหาร / ถ่ายรูป</button></section>
  <section class="card"><h2>ร่างกาย</h2>
    <div class="grid2"><div class="field"><label for="wIn">น้ำหนัก (kg) ตอนเช้า</label><input id="wIn" inputmode="decimal" data-body="weight" value="${D.weight??''}" placeholder="เช่น 82.0"></div>
    <div class="field"><label for="waistIn">รอบเอว (cm) ระดับสะดือ</label><input id="waistIn" inputmode="decimal" data-body="waist" value="${D.waist??''}" placeholder="สัปดาห์ละครั้ง"></div></div>
    <p class="small muted" id="maTxt">${ma?`ค่าเฉลี่ย 7 วัน: <b class="num">${f1(ma)}</b> kg · เป้า ${S.profile.goalWeight} kg`:'ชั่งหลังตื่นนอน เข้าห้องน้ำแล้ว ก่อนกินอะไร'}</p></section>
  <section class="card"><div class="spread"><h2>เวทวันนี้</h2>${P&&code!=='Z2'?'<button class="linkbtn" data-go="train">เปิดโปรแกรม ›</button>':''}</div>${train}</section>`}

function viewTrain(){const D=day();const code=S.sess||sessionFor(S.date)||'UA';const P=PROGRAM[code];
  const chips=ORDER.map(k=>`<button class="sess" data-sess="${k}" aria-pressed="${k===code}"><b><span class="disc ${PROGRAM[k].plate}"></span>${k}</b><span>${PROGRAM[k].wd} ${PROGRAM[k].name}</span></button>`).join('');
  let body='';

  else{body=`<p class="note"><b>${P.name}</b> · ${P.th}<br>อุ่นเครื่อง 5 นาที + เซ็ตเบา 2 เซ็ตก่อนท่าหลัก · ท่าหลักหยุดก่อนหมดแรง 1–2 ครั้ง (RIR 1–2) · ครบเพดาน rep ทุกเซ็ต → เพิ่มน้ำหนักครั้งหน้า</p>`
    +P.ex.map(e=>exCard(e,D)).join('')+cardioCard(D,false)}
  return `${header()}<div class="sessions" role="group" aria-label="เลือกโปรแกรม">${chips}</div>${body}`}

function exCard(e,D){const sg=suggest(e,S.date);const mine=(D.sets||[]).filter(s=>s.ex===e.id);
  const n=Math.max(e.sets,mine.reduce((m,s)=>Math.max(m,s.i+1),0));
  const best=mine.filter(s=>s.done&&s.w>0&&s.r>0&&s.r<=12).reduce((m,s)=>Math.max(m,e1rm(s.w,s.r)),0);
  let hint;if(sg.lp){hint=`ครั้งก่อน ${sd(sg.lp.date)}: ${sg.lp.sets.map(s=>`${s.w}×${s.r}`).join(', ')} → วันนี้ <b>${sg.w} kg</b>${sg.up?' <span class="up">▲ เพิ่มน้ำหนัก</span>':''}`}
  else hint=`ครั้งแรก: เลือกน้ำหนักที่ทำได้ ${e.hi} ครั้งโดยยังเหลือแรง 2–3 ครั้ง`;
  const wNow=(mine.find(s=>s.w)||{}).w||sg.w;let plates='';
  if(e.bar&&wNow){const pl=platesFor(wNow);if(pl)plates=`<div class="plates" aria-label="แผ่นต่อข้าง"><span class="bar"></span>${pl.out.map(p=>`<span class="p" style="height:${PLATE_H[p]}px;background:${PLATE_COLOR[p]}"></span>`).join('')}<span class="lbl">บาร์ 20 + ข้างละ ${pl.out.join(' + ')}${pl.rem>0.01?' (ปัดเศษ)':''}</span></div>`}
  const rows=Array.from({length:n},(_,i)=>{const s=mine.find(x=>x.i===i)||{};const prev=sg.lp&&sg.lp.sets.find(x=>x.i===i);
    const phW=sg.w??'kg';const phR=prev?prev.r:e.lo;
    return `<div class="set ${s.done?'done':''}" data-ex="${e.id}" data-i="${i}"><span class="idx">${i+1}</span>
      <input inputmode="decimal" aria-label="น้ำหนักเซ็ต ${i+1}" id="w-${e.id}-${i}" data-k="w" value="${s.w??''}" placeholder="${phW}">
      <span class="x">×</span><input inputmode="numeric" aria-label="จำนวนครั้งเซ็ต ${i+1}" id="r-${e.id}-${i}" data-k="r" value="${s.r??''}" placeholder="${phR}">
      <button class="chk" data-chk aria-pressed="${!!s.done}" aria-label="เสร็จเซ็ต ${i+1}">✓</button></div>`}).join('');
  return `<article class="card ex"><header>${FIGS[e.id]?`<button class="demo" data-demo="${e.id}" aria-label="ดูท่า ${esc(e.n)}">${artHTML(e.id)}</button>`:''}<div class="ttl"><h3>${e.n}</h3><p class="th">${e.th} · ${e.sets}×${e.lo}–${e.hi} · พัก ${Math.floor(e.rest/60)}:${pad(e.rest%60)}</p>
    ${best?`<span class="pill">e1RM ${Math.round(best)}</span>`:''}</div></header>
    <p class="hint">${hint}</p>${plates}
    <div class="colhead"><span>#</span><span>KG</span><span></span><span>REPS</span><span></span></div>
    <div class="sets">${rows}</div><button class="linkbtn" data-addset="${e.id}">+ เพิ่มเซ็ต</button></article>`}

function cardioCard(D,main){const c=D.cardio||{};const hrmax=Math.round(208-0.7*S.profile.age);
  return `<section class="card"><div class="spread"><h2>${main?'Zone 2 Cardio':'Cardio (ถ้ามี)'}</h2><span class="disc green"></span></div>
  ${main?`<p class="note">Zone 2 ≈ <b>${Math.round(hrmax*.6)}–${Math.round(hrmax*.7)} bpm</b> (60–70% HRmax, Tanaka: 208 − 0.7×อายุ = ${hrmax}) · เดินเร็วจนพูดเป็นประโยคได้แต่ร้องเพลงไม่ได้</p>`:''}
  <div class="grid2"><div class="field"><label for="cMin">นาที</label><input id="cMin" inputmode="numeric" data-cardio="min" value="${c.min??''}" placeholder="45"></div>
  <div class="field"><label for="cHr">HR เฉลี่ย (bpm)</label><input id="cHr" inputmode="numeric" data-cardio="hr" value="${c.hr??''}" placeholder="ไม่บังคับ"></div></div></section>`}

function viewFood(){const D=day(),T=targets(),tot=totals(D);
  const mine=jobs.filter(j=>j.date===S.date);
  const quick=`<form class="quick" id="quick"><input id="aiHint" type="text" autocomplete="off" autocorrect="off" enterkeyhint="done" aria-label="พิมพ์เมนูอาหาร" aria-controls="sugg" placeholder="พิมพ์เมนู เช่น กะเพราหมูสับ ไข่ดาว"><button class="btn" type="submit">เพิ่ม</button></form>

    ${S.canImg?`<label class="photo" for="photo"><span class="cam" aria-hidden="true"></span><span>ถ่ายรูปอาหารให้ AI ประเมิน<small>บันทึกให้อัตโนมัติ แก้ทีหลังได้</small></span></label><input type="file" id="photo" accept="image/*" hidden>`
      :`<p class="small muted">ถ่ายรูปให้ AI ประเมินได้ เมื่อใส่ API key ที่ <button class="linkbtn" data-go="progress" style="display:inline;padding:0">PROGRESS › ตั้งค่า AI</button></p>`}`;

  const pend=mine.map(j=>`<div class="meal pending"><div class="nm">${j.url?`<img src="${j.url}" alt="">`:''}<span>${esc(j.label)}<small>กำลังประเมิน · ${SLOTS[j.slot]}</small></span></div><span class="k">…</span><button class="del" data-canceljob="${j.id}" aria-label="ยกเลิก">×</button></div>`).join('');
  const meals=SLOT_ORDER.map(k=>{const ms=(D.meals||[]).filter(m=>m.slot===k);if(!ms.length)return '';const sk=ms.reduce((s,m)=>s+(+m.kcal||0),0);

  return `${header()}
  <section class="card"><div class="spread"><h2>${Math.round(tot.kcal)} / ${T.kcal} kcal</h2><span class="pill ${tot.p>=T.protein*.9?'good':''}">Protein ${Math.round(tot.p)}/${T.protein} g</span></div>
    <div class="row"><span class="small muted">บันทึกเข้ามื้อ</span><div style="flex:1;min-width:120px">${slotSel}</div></div></section>
  <section class="card"><h2>เพิ่มอาหาร</h2>${ai}${msg}</section>
  <section class="card"><div class="spread"><h2>รายการวันนี้</h2><span class="small muted">แตะรายการเพื่อแก้</span></div>${pend}${meals||(pend?'':'<div class="empty">ยังไม่มีรายการ พิมพ์ชื่อเมนูหรือแตะเมนูด้านบน</div>')}</section>
  <section class="card"><h2>กรอกเอง</h2><p class="small muted">ฐานข้อมูลในแอปมี ${FOOD.length} เมนู ค่าโดยประมาณต่อ 1 ที่ · เมนูที่คุณแก้ตัวเลข แอปจะจำไว้ใช้ครั้งต่อไป (${Object.keys(MYFOODS).length} เมนู)</p>
    <details><summary>กรอกเองทั้งหมด</summary><div class="draft" style="margin-top:10px">
      <div class="field"><label for="mName">ชื่อเมนู</label><input id="mName" type="text"></div>
      <div class="ditem" style="border:0;padding:0">${['kcal','p','c','f'].map(k=>`<div class="field"><label for="m_${k}">${LBL[k]}</label><input id="m_${k}" inputmode="decimal"></div>`).join('')}</div>
      <button class="btn ghost" id="mAdd">เพิ่ม</button></div></details></section>`}

function mealRow(m){const open=S.editMeal===m.id;const SRC={ai:'AI',db:'ฐานข้อมูล',mine:'ของฉัน',preset:'ฐานข้อมูล'};const tag=SRC[m.src]?` · ${SRC[m.src]}${m.edited?' (แก้แล้ว)':''}`:(m.edited?' · แก้แล้ว':'');const q=m.qty||1;
  const low=m.conf==='low'&&!m.edited?' · <span class="lowc">มั่นใจต่ำ</span>':'';

function lineChart({series,target,xMin,xMax,unit,h=170}){
  const W=340,H=h,L=36,R=34,T=12,B=22;let ys=[];series.forEach(s=>s.pts.forEach(p=>ys.push(p[1])));if(target!=null)ys.push(target);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1){lo-=1;hi+=1}
  const step=(()=>{const r=(hi-lo)/3,p=10**Math.floor(Math.log10(r)),f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p})();
  const y0=Math.floor(lo/step)*step,y1=Math.ceil(hi/step)*step;const span=Math.max(1,xMax-xMin);
  const x=t=>L+(t-xMin)/span*(W-L-R),y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);let g='';
  for(let v=y0;v<=y1+1e-9;v+=step){g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${+v.toFixed(1)}</text>`}
  const xl=[xMin,Math.round((xMin+xMax)/2),xMax].filter((v,i,a)=>a.indexOf(v)===i);
  xl.forEach((t,i)=>{g+=`<text x="${x(t)}" y="${H-6}" text-anchor="${i===0?'start':i===xl.length-1?'end':'middle'}">${sd(fromIdx(t))}</text>`});
  if(target!=null)g+=`<line class="tgt" x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}"/><text class="tgtlbl" x="${W-R+4}" y="${y(target)+3}">เป้า</text>`;
  for(const s of series){if(s.kind==='dots')g+=s.pts.map(p=>`<circle class="raw" cx="${x(p[0])}" cy="${y(p[1])}" r="2.6"/>`).join('');
    else if(s.pts.length){const d=s.pts.map((p,i)=>`${i?'L':'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
      const last=s.pts[s.pts.length-1];
      g+=`<path class="area" d="${d}L${x(last[0]).toFixed(1)},${H-B}L${x(s.pts[0][0]).toFixed(1)},${H-B}Z"/><path class="main" d="${d}"/><circle class="end" cx="${x(last[0])}" cy="${y(last[1])}" r="4.5"/><text class="endlbl" x="${Math.min(W-2,x(last[0])+6)}" y="${y(last[1])-8}" text-anchor="end">${f1(last[1])}${unit||''}</text>`}}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}

function barChart(rows,target){const W=340,H=150,L=36,R=34,T=10,B=22;const mx=Math.max(target*1.25,...rows.map(r=>r.v));
  const y=v=>T+(1-v/mx)*(H-T-B);const bw=(W-L-R)/rows.length;let g='';
  [0,Math.round(mx/2/100)*100,Math.round(mx/100)*100].forEach(v=>{if(v<=mx)g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`});
  rows.forEach((r,i)=>{const cx=L+i*bw;if(r.v>0){const cls=r.v>target*1.1?'b-over':r.v<target*.7?'b-under':'b-ok';g+=`<rect class="${cls}" x="${(cx+bw*.18).toFixed(1)}" y="${y(r.v).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${(H-B-y(r.v)).toFixed(1)}" rx="2"/>`}
    if(i%3===0||i===rows.length-1)g+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${sd(r.d)}</text>`});
  g+=`<line class="tgt" x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}"/><text class="tgtlbl" x="${W-R+4}" y="${y(target)+3}">เป้า</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}

async function exportData(){const data={app:'iron-log',version:1,exportedAt:new Date().toISOString(),profile:S.profile,days:S.days,myFoods:MYFOODS};
  const name=`iron-log-${today()}.json`;const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return 'ส่งออกแล้ว'}}catch(e){if(e&&e.name==='AbortError')return ''}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return 'ดาวน์โหลด '+name}
function importData(text){const j=JSON.parse(text);if(!j||j.app!=='iron-log'||typeof j.days!=='object')throw new Error('ไม่ใช่ไฟล์ของ Iron Log');
  let n=0;for(const [d,v] of Object.entries(j.days)){if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&v&&typeof v==='object'){S.days[d]={kind:'day',date:d,weight:null,waist:null,meals:[],sets:[],cardio:null,session:null,...v,date:d};n++}}
  if(j.profile&&typeof j.profile==='object')S.profile={...DEF_PROFILE,...j.profile};if(j.myFoods&&typeof j.myFoods==='object'){MYFOODS={...MYFOODS,...j.myFoods};saveMyFoods()}saveLocal();return n}

async function imgToB64(blob){const url=URL.createObjectURL(blob);try{
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej({code:'image_rejected'});i.src=url});
  const M=1280,k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82).split(',')[1]}finally{URL.revokeObjectURL(url)}}
function parseJSONLoose(t){try{return JSON.parse(t)}catch(e){}const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
  const i=t.search(/[\[{]/),j=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(i>=0&&j>i){try{return JSON.parse(t.slice(i,j+1))}catch(e){}}throw {code:'invalid_json',text:t}}
async function apiJSON(prompt,opts={}){const c=aiCfg();if(!c.key)throw {code:'no_key'};
  const content=[];for(const im of (opts.images||[]))content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await imgToB64(im)}});
  content.push({type:'text',text:prompt});let r;
  try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,
    headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:c.model||'claude-haiku-5-5',max_tokens:1200,messages:[{role:'user',content}]})})}
  catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:navigator.onLine===false?'offline':'upstream_error'}}
  if(!r.ok){let msg='';try{msg=(await r.json()).error.message}catch(e){}

  const j=await r.json();return parseJSONLoose((j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join(''))}

function saveMyFoods(){try{localStorage.setItem(MFK,JSON.stringify(MYFOODS))}catch(e){}}
function myList(){return Object.values(MYFOODS).map(x=>({...x,mine:true,keys:[normQ(x.name)]}))}
function rememberMeal(m){if(!m||!m.edited||!m.name)return;const q=m.qty||1;const k=normQ(m.name);if(k.length<2)return;
  MYFOODS[k]={name:m.name.trim().slice(0,60),portion:m.portion||'',kcal:Math.round(m.kcal/q),p:+(m.p/q).toFixed(1),c:+(m.c/q).toFixed(1),f:+(m.f/q).toFixed(1),g:m.g||null,t:Date.now()};saveMyFoods()}
const UNIT_RE=/(ที่|จาน|ชาม|ถ้วย|แก้ว|ฟอง|ลูก|ชิ้น|ทัพพี|ห่อ|ไม้|สกู๊ป|ซอง|กล่อง|ขวด|กระป๋อง|ฝัก|คู่|ช้อนโต๊ะ|ช้อนชา|กำมือ|ถุง)/;
function parseQty(text){let t=String(text||'');let qty=null,grams=null;
  let m=t.match(/(\d+(?:\.\d+)?)\s*(g|กรัม|ก\.)(?![a-zA-Zก-๙])/i);if(m){grams=+m[1];t=t.replace(m[0],' ')}
  if(!m){m=t.match(/(?:[x×]\s*(\d+(?:\.\d+)?))|(\d+(?:\.\d+)?)(?![-\d.])\s*(?:[x×]|ที่|จาน|ชาม|ถ้วย|แก้ว|ฟอง|ลูก|ชิ้น|ทัพพี|ห่อ|ไม้|สกู๊ป|ซอง|กล่อง|ขวด|กระป๋อง|ฝัก|คู่|ช้อนโต๊ะ|ช้อนชา|กำมือ|ถุง)?/i);
    if(m){const v=+(m[1]||m[2]);if(v>0&&v<=20){qty=v;t=t.replace(m[0],' ')}}}
  t=t.replace(/ครึ่ง(ที่|จาน|ชาม|ลูก|ห่อ|ถ้วย|แก้ว)?/g,()=>{qty=qty||0.5;return ' '});
  return {text:t.trim(),qty,grams}}
function suggest(text,n=6){const q=normQ(parseQty(text).text);if(q.length<1)return [];
  const out=[];for(const it of [...myList(),...FOOD]){let best=0;
    for(const k of it.keys){let sc=0;if(k===q)sc=100;else if(k.startsWith(q))sc=80-Math.min(20,k.length-q.length);else if(k.includes(q))sc=60-Math.min(20,k.length-q.length);else if(q.length>=4&&q.includes(k))sc=40+Math.min(20,k.length);if(sc>best)best=sc}
    if(best>0)out.push({it,sc:best+(it.mine?15:0)})}
  const seen=new Set();return out.sort((a,b)=>b.sc-a.sc).filter(x=>{const k=normQ(x.it.name);if(seen.has(k))return false;seen.add(k);return true}).slice(0,n).map(x=>x.it)}
function coverMatch(text){const raw=normQ(parseQty(text).text);if(raw.length<2)return null;
  const cands=[];for(const it of [...myList(),...FOOD])for(const k of it.keys){let i=raw.indexOf(k);while(i>=0){cands.push({it,i,len:k.length,mine:it.mine});i=raw.indexOf(k,i+1)}}
  cands.sort((a,b)=>b.len-a.len||(b.mine?1:0)-(a.mine?1:0));const used=new Array(raw.length).fill(false);const pick=[];
  for(const c of cands){let ok=true;for(let j=c.i;j<c.i+c.len;j++)if(used[j]){ok=false;break}if(!ok)continue;for(let j=c.i;j<c.i+c.len;j++)used[j]=true;pick.push(c)}
  const cov=used.filter(Boolean).length/raw.length;if(!pick.length||cov<.6)return null;return pick.sort((a,b)=>a.i-b.i).map(c=>c.it)}
function mealFrom(it,qty,grams){let q=qty||1;if(grams&&it.g)q=+(grams/it.g).toFixed(2);
  const portion=(grams&&it.g)?`${grams} g`:it.portion;
  return {id:uid(),slot:S.slot,name:it.name,portion,qty:q,base:{kcal:it.kcal,p:it.p,c:it.c,f:it.f},g:it.g||null,
    kcal:Math.round(it.kcal*q),p:+(it.p*q).toFixed(1),c:+(it.c*q).toFixed(1),f:+(it.f*q).toFixed(1),src:it.mine?'mine':'db'}}

function updateSugg(){const el=$('#sugg'),inp=$('#aiHint');if(!el||!inp)return;const txt=inp.value.trim();

  h+=list.map((it,i)=>{const k=Math.round(it.kcal*mult(it));return `<button class="sg" data-sg="${i}"><span class="sn">${esc(it.name)}${it.mine?' <i>ของฉัน</i>':''}<small>${grams&&it.g?grams+' g':esc(it.portion)+(qty&&qty!==1?' ×'+qty:'')} · P ${f1(it.p*mult(it))} · C ${f1(it.c*mult(it))} · F ${f1(it.f*mult(it))}</small></span><span class="sk">${k}</span></button>`}).join('');
  if(S.canAI)h+=`<button class="sg ai" data-sgai="1"><span class="sn">ให้ AI ประเมิน “${esc(txt)}”</span></button>`;
  h+=`<button class="sg ai" data-sgblank="1"><span class="sn">เพิ่ม “${esc(txt)}” แล้วกรอกตัวเลขเอง</span></button>`;

function quickChips(){const seen=new Set(),rec=[];const ds=Object.keys(S.days).sort().reverse();
  for(const d of ds){for(const m of (S.days[d].meals||[]).slice().reverse()){const k=normQ(m.name);if(seen.has(k)||!m.name)continue;seen.add(k);rec.push(m);if(rec.length>=8)break}if(rec.length>=8)break}
  S.quick=[...rec.map(m=>({name:m.name,portion:m.portion||'',kcal:Math.round(m.kcal/(m.qty||1)),p:(m.p||0)/(m.qty||1),c:(m.c||0)/(m.qty||1),f:(m.f||0)/(m.qty||1),g:m.g||null,mine:true})),
    ...PRESETS.filter(p=>!seen.has(normQ(p.name)))].slice(0,12);

function submitText(){const el=$('#aiHint');const text=(el&&el.value||'').trim();if(!text){el&&el.focus();return}

function queueAI(img,hint){S.aiErr='';S.aiMsg='';let url=null;if(img){try{url=URL.createObjectURL(img)}catch(e){}}
  const job={id:uid(),date:S.date,slot:S.slot,img,hint,url,label:hint||'รูปอาหาร',ctl:new AbortController()};jobs.push(job);safeRender();runJob(job)}
async function runJob(job){
  try{const opts={signal:job.ctl.signal,modelTier:job.img?'default':'quick'};if(job.img)opts.images=[job.img];
    const res=await sample.json(aiPrompt(!!job.img,job.hint),opts);
    const conf=['low','medium','high'].includes(res&&res.confidence)?res.confidence:null;
    const items=(Array.isArray(res&&res.items)?res.items:[]).slice(0,8).map(it=>({id:uid(),slot:job.slot,name:String(it.name||'อาหาร').slice(0,60),portion:String(it.portion||'').slice(0,60),
      kcal:Math.max(0,Math.round(num(it.kcal)||0)),p:+(num(it.protein)||0).toFixed(1),c:+(num(it.carb)||0).toFixed(1),f:+(num(it.fat)||0).toFixed(1),src:'ai',conf,qty:1})).map(m=>({...m,base:{kcal:m.kcal,p:m.p,c:m.c,f:m.f}}));
    if(!items.length){if(job.img)S.aiErr='ไม่พบอาหารในรูป ลองถ่ายให้เห็นจานชัดขึ้น';else S.aiMsg=fallbackAdd(job.hint,job.date,job.slot)}
    else{const D=day(job.date);D.meals.push(...items);saveDay(job.date);const k=items.reduce((a,i)=>a+i.kcal,0);
      S.aiMsg=`บันทึกเข้า${SLOTS[job.slot]}แล้ว ${items.length} รายการ · <b>${k}</b> kcal${conf==='low'?' · มั่นใจต่ำ ตรวจตัวเลขด้วย':''}`}
  }catch(e){const c=e&&e.code;
    if(c==='images_unavailable')S.canImg=false;
    if(c==='not_granted'||c==='sampling_disabled')S.canAI=false;if(c==='image_rejected'&&!job.hint)S.aiErr='อ่านรูปนี้ไม่ได้ ลองถ่ายใหม่ หรือเลือกรูป JPG';
    if(c!=='cancelled'){S.aiErr=AI_ERR[c]||'เชื่อมต่อไม่สำเร็จ ลองอีกครั้ง';if(job.hint&&!job.img){S.aiErr='';S.aiMsg=(AI_ERR[c]||'AI ไม่ตอบ')+' · '+fallbackAdd(job.hint,job.date,job.slot)}}}
  finally{jobs=jobs.filter(j=>j!==job);if(job.url){try{URL.revokeObjectURL(job.url)}catch(e){}}if(S.view==='food'||S.view==='today')safeRender()}}

app.addEventListener('input',e=>{const t=e.target;const D=day();
  if(t.dataset.body){D[t.dataset.body]=num(t.value);saveDay();const ws=weights();const ma=maAt(ws,tIdx(S.date));const m=$('#maTxt');if(m&&ma)m.innerHTML=`ค่าเฉลี่ย 7 วัน: <b class="num">${f1(ma)}</b> kg · เป้า ${S.profile.goalWeight} kg`}
  else if(t.dataset.k&&t.closest('.set')){const row=t.closest('.set');const ex=row.dataset.ex,i=+row.dataset.i;let s=D.sets.find(x=>x.ex===ex&&x.i===i);
    if(!s){s={ex,i,w:null,r:null,done:false};D.sets.push(s)}s[t.dataset.k]=num(t.value);saveDay()}
  else if(t.dataset.cardio){D.cardio={...(D.cardio||{}),[t.dataset.cardio]:num(t.value)};saveDay()}
  else if(t.id==='aiHint')updateSugg();
  else if(t.dataset.me&&t.dataset.me!=='slot'){const m=D.meals.find(x=>x.id===t.dataset.mid);if(m){const k=t.dataset.me;ensureBase(m);
    if(k==='name'){m.name=t.value;m.edited=true}
    else if(k==='qty'){const v=num(t.value);if(v>0){setQty(m,v);['kcal','p','c','f'].forEach(x=>{const el=document.getElementById(`me-${x}-${m.id}`);if(el)el.value=x==='kcal'?Math.round(m.kcal):f1(m[x])})}}
    else{const v=num(t.value)||0;m[k]=v;m.base[k]=+(v/(m.qty||1)).toFixed(2);m.edited=true}
    saveDay();const el=document.getElementById('k-'+m.id);if(el)el.textContent=Math.round(m.kcal)}}
});
app.addEventListener('change',e=>{const t=e.target;
  if(t.id==='slot'){S.slot=t.value;const b=$('#aiAdd');if(b)b.textContent='บันทึกเข้า'+SLOTS[S.slot]}
  else if(t.id==='e1sel'){S.e1rmEx=t.value;render()}
  else if(t.id==='photo'){const f=t.files&&t.files[0];if(f&&sample){const h=$('#aiHint');const hint=(h&&h.value||'').trim();if(h)h.value='';t.value='';queueAI(f,hint)}}
  else if(t.dataset.me==='slot'){const m=day().meals.find(x=>x.id===t.dataset.mid);if(m){m.slot=t.value;saveDay();render()}}
  else if(t.id==='impFile'||t.id==='impFile2'){const f=t.files&&t.files[0];if(!f)return;const sid=t.id==='impFile'?'#bkStat':'#bkStat2';
    f.text().then(txt=>{let j;try{j=JSON.parse(txt)}catch(e){throw new Error('ไฟล์นี้ไม่ใช่ JSON ที่ export จาก Iron Log')}const n=importData(JSON.stringify(j));
      S.aiErr='';S.aiMsg='';render();const b=$(sid)||$('#bkStat');if(b)b.textContent=`นำเข้าแล้ว ${n} วัน`;else{const h=$('#app');h.insertAdjacentHTML('afterbegin',`<p class="ok" role="status" style="text-align:center">นำเข้าแล้ว ${n} วัน ✓</p>`)}})
    .catch(err=>{const b=$(sid);if(b)b.textContent='นำเข้าไม่สำเร็จ: '+(err&&err.message||'ไฟล์ไม่ถูกต้อง')}).finally(()=>{t.value=''})}
  else if(t.dataset.prof){const k=t.dataset.prof;const v=num(t.value);if(k==='kcalOverride')S.profile.kcalOverride=v&&v>=1000?Math.round(v):null;else if(v!=null)S.profile[k]=v;saveProfile();render()}
});

/* ---------- rest timer ---------- */
let restEnd=0,restDur=1,restTick=null;
function nextUp(exId){const code=S.sess||sessionFor(S.date);const P=PROGRAM[code];if(!P)return null;const D=day();const i=P.ex.findIndex(e=>e.id===exId);if(i<0)return null;
  for(let k=i;k<P.ex.length;k++){const e=P.ex[k];const mine=D.sets.filter(x=>x.ex===e.id);const n=Math.max(e.sets,mine.reduce((m,x)=>Math.max(m,x.i+1),0));
    for(let j=0;j<n;j++){const s=mine.find(x=>x.i===j);if(!s||!s.done)return {e,set:j+1,same:k===i}}}return null}
function startRest(sec,name,exId){restEnd=Date.now()+sec*1000;restDur=sec;const r=$('#rest');r.hidden=false;r.classList.remove('done');$('#restLbl').textContent='พัก · '+name;
  const nx=exId?nextUp(exId):null;$('#restNext').innerHTML=nx&&FIGS[nx.e.id]?`<button type="button" class="nx" data-demo="${nx.e.id}" aria-label="ดูท่า ${esc(nx.e.n)}">${artHTML(nx.e.id)}</button>`:'';
  $('#restNextTxt').textContent=nx?`ถัดไป: ${nx.e.n} · เซ็ต ${nx.set}${nx.same?'':' (ท่าใหม่)'}`:(exId?'ครบทุกเซ็ตของวันนี้แล้ว':'');clearInterval(restTick);restTick=setInterval(updRest,250);updRest()}
function updRest(){const left=Math.max(0,(restEnd-Date.now())/1000);const s=Math.ceil(left);$('#restBar').style.width=(left/restDur*100)+'%';
  if(left<=0){clearInterval(restTick);$('#rest').classList.add('done');$('#restTime').textContent='GO';$('#restLbl').textContent='ได้เวลาเซ็ตถัดไป';return}
  $('#restTime').textContent=`${Math.floor(s/60)}:${pad(s%60)}`}
$('#rest').addEventListener('click',e=>{const b=e.target.closest('[data-demo]');if(b)openDemo(b.dataset.demo)});
$('#restClose').addEventListener('click',()=>{clearInterval(restTick);$('#rest').hidden=true});

boot();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
